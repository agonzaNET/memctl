# macOS tests (ADR-0022).
#
# Runs go vet and go test on Apple silicon, the architecture of the darwin
# release binary, with the Go version pinned in .mise.toml. Started by hand
# for a ref (run it on main before tagging), or called by the release
# workflow for the tag. Nothing runs on push or tag.

name: test-macos

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test"
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or commit to test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out the ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read the Go version from .mise.toml
        id: go
        run: |
          version=$(sed -n 's/^go = "\(.*\)"$/\1/p' .mise.toml)
          if [ -z "$version" ]; then
            echo "::error::no go version in .mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
