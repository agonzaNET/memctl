# Release workflow (ADR-0012, stage plan 0003).
#
# Started by hand for an existing vX.Y.Z tag. It runs the tests on macOS for
# that tag (test-macos.yml, ADR-0022), then checks out the tag, runs make
# verify and govulncheck (ADR-0020), builds the three release archives
# and SHA256SUMS, and creates
# the GitHub release with the tag's CHANGELOG section as notes. It never
# pushes code, never creates or moves tags, and fails if the release exists.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The darwin binary is tested on its own platform first; no release is
  # built when a test fails there (ADR-0022).
  test-macos:
    uses: ./.github/workflows/test-macos.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
    permissions:
      contents: read

  release:
    needs: test-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag input
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z, got '$TAG'"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Read the Go version from .mise.toml
        id: go
        run: |
          version=$(sed -n 's/^go = "\(.*\)"$/\1/p' .mise.toml)
          if [ -z "$version" ]; then
            echo "::error::no go version in .mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - name: Release notes from CHANGELOG.md
        run: bash scripts/release-notes.sh "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Verify
        run: make verify

      # Stops the release when the code calls a known vulnerability in the
      # standard library or a module; uncalled ones are only listed (ADR-0020).
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build the release archives
        run: bash scripts/release-build.sh "$VERSION" dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "memctl $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
